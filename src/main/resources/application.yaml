spring:
  application:
    name: resilience-common
server:
  port:
    8080

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  # Prometheus
  prometheus:
    metrics:
      export:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 5
        failureRateThreshold: 60
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
    instances:
      backendA:
        baseConfig: default
      backendB:
        baseConfig: default
        failureRateThreshold: 60

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.io.IOException
        ignoreExceptions:
          - com.example.resilience4jdemo.BusinessException
    instances:
      backendA:
        baseConfig: default

    # --- Bulkhead (Semaphore) ---
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 5
        maxWaitDuration: 0ms
    instances:
      backendA:
        baseConfig: default

  # --- TimeLimiter ---
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      backendA:
        baseConfig: default

